name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.preview.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run skills:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test -- --passWithNoTests
      - run: npm run build
      - run: npm run test:build
      - name: Build PR preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        run: npm run build:debug
      - name: Upload PR preview
        id: preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-${{ github.event.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/debug/sbg-vanilla-plus.user.js
          if-no-files-found: error
          retention-days: 14

  preview-comment:
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      needs.check.outputs.preview-url != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3
        with:
          message-id: preview-${{ github.run_id }}-${{ github.run_attempt }}
          message: |
            Тестовая сборка **SBG Vanilla+ [DEBUG]** прошла проверки.

            [Скачать тестовую сборку (ZIP)](${{ needs.check.outputs.preview-url }})

            PR commit: `${{ github.event.pull_request.head.sha }}`
            Собрана совместно с main (merge commit): `${{ github.sha }}`
            [Запуск CI](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }})

            Для скачивания нужен вход в GitHub. Распакуйте ZIP и импортируйте
            `sbg-vanilla-plus.user.js` в менеджер юзерскриптов. Перед проверкой отключите стабильную версию.
            Эта сборка не обновляется автоматически; после проверки отключите её
            и включите стабильную версию. Ссылка действует 14 дней, если artifact
            или запуск CI не удалён раньше.
